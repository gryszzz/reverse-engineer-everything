name: REE macOS smoke

on:
  push:
    branches: [main, "rel/first-lab-foundations"]
  pull_request:
    branches: [main, "rel/first-lab-foundations"]
    paths:
      - "src/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - ".nvmrc"
      - ".github/actions/npm-cache/**"
      - "ree.mjs"
      - "rel.mjs"
      - "Start-REE.command"
      - "Start-REE-Studio.command"
      - "Start-REL.command"
      - "FIRST_10_MINUTES.md"
      - "rel/**"
      - "experiments/rel-first-lab/**"
      - "experiments/rel-visual-lab/**"
      - "experiments/ree-investigation-boundary/**"
      - ".github/workflows/rel-macos-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos-first-lab:
    name: macOS REE smoke and real evidence
    runs-on: macos-15
    timeout-minutes: 20
    env:
      HUSKY: "0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - name: Cache npm package downloads
        id: npm-cache
        uses: ./.github/actions/npm-cache
      - name: Verify Mac platform and report actual runner resources
        run: |
          test "$(uname -s)" = "Darwin"
          node ree.mjs doctor
          node ree.mjs doctor --json > "$RUNNER_TEMP/rel-mac-doctor.json"
      - name: Verify Finder launcher executable mode and macOS shell syntax
        run: |
          test -x Start-REE.command
          test -x Start-REE-Studio.command
          /bin/zsh -n Start-REE.command
          /bin/zsh -n Start-REE-Studio.command
      - name: Run deterministic Mac readiness checks and local visual lab tests
        run: |
          node --test rel/mac-doctor.test.mjs
          node --test rel/lab-server.test.mjs
          node --test rel/studio/graph.test.mjs rel/studio/studio.test.mjs
      - run: npm ci
      - name: Build native-host REA runtime on macOS
        run: npm run build:cached
      - name: Discover and verify a bounded C counterexample
        run: |
          node scripts/verify/reconstruction/c-process-probe.mjs "$RUNNER_TEMP/ree-c-proposal" --approve-recommended-probes --refine-candidate
          proposal_digest="$(node -e 'process.stdout.write(JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8")).proposal_sha256)' "$RUNNER_TEMP/ree-c-proposal/candidate-refinement/candidate-patch-proposal.json")"
          node scripts/verify/reconstruction/c-process-probe.mjs "$RUNNER_TEMP/ree-c-approved" --approve-recommended-probes --refine-candidate "--approve-proposed-patch=$proposal_digest"
      - name: Verify source-blind bounded expression synthesis
        run: |
          node --test scripts/verify/reconstruction/black-box-expression-synthesis.test.mjs
          node scripts/verify/reconstruction/c-process-probe.mjs "$RUNNER_TEMP/ree-hypothesis-plan" --approve-recommended-probes --refine-candidate --black-box-synthesis --active-hypothesis-discrimination
          probe_digest="$(node -e 'process.stdout.write(JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8")).plan_sha256)' "$RUNNER_TEMP/ree-hypothesis-plan/hypothesis-probe-plan.json")"
          node scripts/verify/reconstruction/c-process-probe.mjs "$RUNNER_TEMP/ree-hypothesis-observed" --approve-recommended-probes --refine-candidate --black-box-synthesis --active-hypothesis-discrimination "--approve-hypothesis-probe=$probe_digest"
          proposal_digest="$(node -e 'process.stdout.write(JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8")).proposal_sha256)' "$RUNNER_TEMP/ree-hypothesis-observed/candidate-refinement/candidate-patch-proposal.json")"
          node scripts/verify/reconstruction/c-process-probe.mjs "$RUNNER_TEMP/ree-hypothesis-approved" --approve-recommended-probes --refine-candidate --black-box-synthesis --active-hypothesis-discrimination "--approve-hypothesis-probe=$probe_digest" "--approve-proposed-patch=$proposal_digest"
      - name: Verify a cross-language tax reconstruction probe loop
        run: node scripts/verify/reconstruction/cross-language-tax-probe.mjs --approve-recommended-probes
      - name: Verify real Mac-side REA MCP discovery
        run: node --test rel/codex-mcp.test.mjs
      - name: Verify static analysis and saved relationships on macOS
        run: node --test rel/analyze-static.test.mjs
      - name: Verify Investigation Studio UI-to-engine analysis
        run: node --test rel/studio/studio-engine.test.mjs
      - name: Run real source-owned REA analysis
        run: node ree.mjs demo --run --out "$RUNNER_TEMP/rel-mac-evidence"
      - name: Verify evidence exploration on Mac
        run: |
          node --test rel/evidence-explorer.test.mjs
          node rel/evidence-explorer.mjs "$RUNNER_TEMP/rel-mac-evidence/evidence.json" --find cli.mjs --limit 12
      - name: Retain Mac diagnostic and evidence artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rel-macos-first-lab
          path: |
            ${{ runner.temp }}/rel-mac-doctor.json
            ${{ runner.temp }}/rel-mac-evidence/
            ${{ runner.temp }}/ree-c-investigation/
            ${{ runner.temp }}/ree-cross-language-tax-*/
          if-no-files-found: warn
          retention-days: 7
