<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 720" role="img" aria-labelledby="title desc">
  <title id="title">REE investigation map</title>
  <desc id="desc">Artifacts and supplied observations pass through distinct analysis routes into retained Evidence. Feature traces, comparisons, runtime reconciliation, and reconstruction checks use those records while keeping claims bounded by coverage and selected cases.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#d4e3f1" stroke-opacity=".045" stroke-width="1"/>
    </pattern>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0 9 4.5 0 9Z" fill="#87a1b9"/>
    </marker>
  </defs>
  <rect width="900" height="720" rx="18" fill="#101820"/>
  <rect width="900" height="720" rx="18" fill="url(#grid)"/>
  <path d="M0 74H900" stroke="#d4e3f1" stroke-opacity=".12"/>
  <text x="42" y="48" fill="#f0f4f6" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" font-weight="700" letter-spacing="2">REE / INVESTIGATION MAP</text>
  <text x="858" y="48" text-anchor="end" fill="#a8b8c7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">EVIDENCE IS THE HANDOFF</text>

  <g fill="#17232d" stroke="#526779" stroke-width="1.5">
    <rect x="42" y="103" width="816" height="76" rx="10"/>
    <rect x="42" y="222" width="816" height="94" rx="10"/>
    <rect x="42" y="365" width="816" height="146" rx="12" stroke="#f2b66d" stroke-width="2" fill="#1a2832"/>
    <rect x="42" y="560" width="816" height="82" rx="10"/>
  </g>

  <g fill="#94a8ba" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="700" letter-spacing="1.5">
    <text x="64" y="130">01 / INPUT</text>
    <text x="64" y="249">02 / ANALYSIS ROUTE</text>
    <text x="64" y="393" fill="#f2b66d">03 / CANONICAL EVIDENCE</text>
    <text x="64" y="587">04 / QUESTIONS</text>
  </g>

  <text x="64" y="159" fill="#edf2f5" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="21" font-weight="620">Source or binary · version pair · supplied observation</text>

  <g fill="#edf2f5" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="19" font-weight="620">
    <text x="64" y="281">REE static path</text>
    <text x="339" y="281">REA built-in parser</text>
    <text x="637" y="281">Selected provider</text>
  </g>
  <g fill="#9fb0be" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="14">
    <text x="64" y="301">JavaScript / Electron</text>
    <text x="339" y="301">format-specific operations</text>
    <text x="637" y="301">host and tool vary</text>
  </g>

  <g fill="none" stroke="#87a1b9" stroke-width="1.6" marker-end="url(#arrow)">
    <path d="M450 179V214"/>
    <path d="M450 316V357"/>
    <path d="M450 511V552"/>
  </g>

  <g fill="#f0f4f6" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="18">
    <text x="64" y="430">Artifact identity + digest</text>
    <text x="64" y="461">Operation + provider · facts + source links</text>
    <text x="64" y="492">Confidence + authority · coverage + unknowns</text>
  </g>

  <g fill="#edf2f5" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="17" font-weight="600">
    <text x="64" y="623">Feature trace</text>
    <text x="262" y="623">Compare versions</text>
    <text x="485" y="623">Reconcile runtime</text>
    <text x="696" y="623">Check obligations</text>
  </g>

  <path d="M42 670H858" stroke="#d4e3f1" stroke-opacity=".15"/>
  <circle cx="50" cy="695" r="4" fill="#f2b66d"/>
  <text x="64" y="700" fill="#d3dee6" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="15">Derived results keep parent links. Claims stay within chosen evidence, authority, cases, and dimensions.</text>
</svg>
